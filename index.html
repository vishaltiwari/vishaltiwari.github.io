    <!-- Background slideshow + moving dots indicator CSS -->
    <style>
      /* Ensure hero covers and pseudo-elements don't tile */
      #hero.site-blocks-cover {
        position: relative;
        overflow: hidden;
      }
      #hero.site-blocks-cover::before,
      #hero.site-blocks-cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: opacity 0.8s ease-in-out;
        z-index: 0;
      }
      #hero.site-blocks-cover > .container,
      #hero.site-blocks-cover .overlay-content {
        position: relative;
        z-index: 2;
      }
      /* Optional tint overlay (if you want dimming) */
      #hero.site-blocks-cover.overlay::after { /* keep above backgrounds if overlay class used */
        /* nothing here - overlay tint handled by site styles; ensure z-index ordering */
      }

      /* Dots container bottom-left centered */
      .bg-dots {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 24px;
        display: flex;
        gap: 12px;
        z-index: 3;
        align-items: center;
        pointer-events: none; /* allow clicks pass-through unless you want clickable dots */
      }

      /* Each dot */
      .bg-dots .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.35);
        transition: background 0.3s ease, transform 0.3s ease;
      }
      .bg-dots .dot.active {
        background: rgba(255,255,255,0.95);
        transform: scale(1.2);
      }

      /* Moving "progress" dot (a slightly bigger dot that slides along) */
      .bg-dots .moving {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
        top: 50%;
        transform: translate(-50%, -50%);
        transition: left 0.6s cubic-bezier(.2,.8,.2,1);
        pointer-events: none;
        z-index: 1;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      }

      /* Make dots clickable on hover if you enable pointer events later */
      .bg-dots .dot.clickable { pointer-events: auto; cursor: pointer; }

      /* Small responsive tweak */
      @media (max-width: 576px) {
        .bg-dots { gap: 8px; bottom: 16px; }
        .bg-dots .dot { width: 8px; height: 8px; }
        .bg-dots .moving { width: 12px; height: 12px; }
      }
    </style>

  <script>
  /*
    Background slideshow with a moving dot indicator.
    - Edit the images[] array to include your images.
    - intervalMs controls how long each image shows.
    - The moving dot slides between static dots while they toggle active state.
  */
  (function () {
    var images = [
      'images/home_back.png',
      'images/4D_GIS.png',
      'images/website_wallpaper2.png'
      // add more image paths here
    ];
    var intervalMs = 3500; // 3.5s between images
    var transitionDurationMs = 800; // matches CSS transition 0.8s

    var hero = document.getElementById('hero');
    var dotsContainer = document.getElementById('bgDots');
    var movingDot = document.getElementById('bgMovingDot');
    if (!hero || !dotsContainer || !movingDot || images.length === 0) return;

    // Preload images
    images.forEach(function (s) { var i = new Image(); i.src = s; });

    // Prepare dynamic stylesheet for pseudo-elements so we keep background-size/no-repeat etc.
    var styleEl = document.createElement('style');
    document.head.appendChild(styleEl);
    var sheet = styleEl.sheet;

    function updatePseudo(beforeUrl, afterUrl, beforeOpacity, afterOpacity) {
      while (sheet.cssRules.length) sheet.deleteRule(0);
      var b = "url('" + beforeUrl + "')";
      var a = "url('" + afterUrl + "')";
      var selBefore = "#hero.site-blocks-cover::before";
      var selAfter  = "#hero.site-blocks-cover::after";
      var ruleBefore = selBefore + " { background-image: " + b + "; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: " + beforeOpacity + "; }";
      var ruleAfter  = selAfter  + " { background-image: " + a + "; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: " + afterOpacity + "; }";
      sheet.insertRule(ruleBefore, 0);
      sheet.insertRule(ruleAfter, 1);
    }

    // Build static dots based on images count
    var dots = [];
    images.forEach(function (_, idx) {
      var d = document.createElement('div');
      d.className = 'dot';
      // Optional: make clickable by uncommenting next line
      // d.classList.add('clickable');
      // d.addEventListener('click', function () { goToIndex(idx); });
      dotsContainer.appendChild(d);
      dots.push(d);
    });

    // Position moving dot initially on first static dot
    function positionMovingDotOn(index) {
      var targetDot = dots[index];
      if (!targetDot) return;
      // Calculate center position of the target dot relative to container
      var containerRect = dotsContainer.getBoundingClientRect();
      var dotRect = targetDot.getBoundingClientRect();
      // left relative to container center translation (we positioned container at 50% with translateX(-50%))
      var left = (dotRect.left + dotRect.width / 2) - containerRect.left;
      movingDot.style.left = left + 'px';
      // update active class
      dots.forEach(function (el, i) { el.classList.toggle('active', i === index); });
    }

    // Slideshow logic with cross-fade using ::before/::after
    var current = 0;
    var next = (current + 1) % images.length;
    // initialize pseudo backgrounds: current visible, next hidden
    updatePseudo(images[current], images[next], 1, 0);
    // initial dot placement (wait for layout)
    setTimeout(function () { positionMovingDotOn(0); }, 50);

    var intervalHandle = null;
    function startSlideshow() {
      intervalHandle = setInterval(function () {
        var incoming = (current + 1) % images.length;
        // set incoming into ::after, then fade it in
        updatePseudo(images[current], images[incoming], 1, 0);
        // small delay then fade
        setTimeout(function () {
          updatePseudo(images[current], images[incoming], 0, 1);
          // move the moving dot at the same time (slightly longer transition so it's smooth)
          positionMovingDotOn(incoming);
          // after transition completes, rotate current and prepare next
          setTimeout(function () {
            current = incoming;
            var upcoming = (current + 1) % images.length;
            updatePseudo(images[current], images[upcoming], 1, 0);
          }, transitionDurationMs + 80);
        }, 20);
      }, intervalMs);
    }

    // Optional function to jump to an index (if you enable clickable dots)
    function goToIndex(i) {
      if (i === current) return;
      clearInterval(intervalHandle);
      // fade to selected image immediately
      updatePseudo(images[current], images[i], 1, 0);
      setTimeout(function () {
        updatePseudo(images[current], images[i], 0, 1);
        positionMovingDotOn(i);
        setTimeout(function () {
          current = i;
          var upcoming = (current + 1) % images.length;
          updatePseudo(images[current], images[upcoming], 1, 0);
          startSlideshow();
        }, transitionDurationMs + 80);
      }, 20);
    }

    // start
    startSlideshow();

    // Reposition moving dot on resize to stay aligned
    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        positionMovingDotOn(current);
      }, 120);
    });
  })();
  </script>

<script>
(function(){
  // EDIT THIS: list the images you want to rotate (relative to the site root or absolute URLs)
  var images = [
    'images/website_wallpaper2.png',
    'images/website_wallpaper3.png',
    'images/website_wallpaper4.png'
  ];

  // How long each image stays visible (ms)
  var intervalMs = 3500;
  // Must match CSS transition for .bg-layer (900ms above)
  var transitionMs = 900;

  var hero = document.getElementById('hero');
  if (!hero || !images || images.length === 0) return;

  var layerA = hero.querySelector('.layer-a');
  var layerB = hero.querySelector('.layer-b');
  var dotsContainer = document.getElementById('bgDots');
  var movingDot = document.getElementById('bgMovingDot');

  if (!layerA || !layerB || !dotsContainer || !movingDot) return;

  // Preload images
  images.forEach(function(src){ var i = new Image(); i.src = src; });

  // Create static dots
  var dots = [];
  images.forEach(function(_, idx){
    var d = document.createElement('div');
    d.className = 'dot';
    // If you want clickable dots, uncomment the next two lines:
    // d.style.pointerEvents = 'auto';
    // d.addEventListener('click', function(){ goToIndex(idx); });
    dotsContainer.appendChild(d);
    dots.push(d);
  });

  // Position the moving dot centered on the target static dot
  function positionMovingDotOn(index) {
    var target = dots[index];
    if (!target) return;
    var contRect = dotsContainer.getBoundingClientRect();
    var tRect = target.getBoundingClientRect();
    var left = (tRect.left + tRect.width/2) - contRect.left;
    movingDot.style.left = left + 'px';
    dots.forEach(function(el, i){ el.classList.toggle('active', i === index); });
  }

  // initial setup
  var current = 0;
  var visibleLayer = layerA;
  var hiddenLayer = layerB;

  visibleLayer.style.backgroundImage = "url('" + images[current] + "')";
  visibleLayer.classList.add('visible');

  var nextIndex = (current + 1) % images.length;
  hiddenLayer.style.backgroundImage = "url('" + images[nextIndex] + "')";
  hiddenLayer.classList.remove('visible');

  // small timeout so DOM layout is done before positioning moving dot
  setTimeout(function(){ positionMovingDotOn(0); }, 60);

  // slideshow loop
  var intervalId = setInterval(advance, intervalMs);

  function advance(){
    var incoming = (current + 1) % images.length;
    // ensure hidden has the incoming image
    hiddenLayer.style.backgroundImage = "url('" + images[incoming] + "')";
    // cross-fade: show hidden, hide visible
    hiddenLayer.classList.add('visible');
    visibleLayer.classList.remove('visible');
    // move dot
    positionMovingDotOn(incoming);

    // after transition ends, swap references and prepare next
    setTimeout(function(){
      var tmp = visibleLayer; visibleLayer = hiddenLayer; hiddenLayer = tmp;
      current = incoming;
      var upcoming = (current + 1) % images.length;
      hiddenLayer.style.backgroundImage = "url('" + images[upcoming] + "')";
      hiddenLayer.classList.remove('visible');
    }, transitionMs + 25);
  }

  // optional: navigate to specific index (used when you enable clickable dots)
  function goToIndex(i){
    if (i === current) return;
    clearInterval(intervalId);
    hiddenLayer.style.backgroundImage = "url('" + images[i] + "')";
    hiddenLayer.classList.add('visible');
    visibleLayer.classList.remove('visible');
    positionMovingDotOn(i);
    setTimeout(function(){
      var tmp = visibleLayer; visibleLayer = hiddenLayer; hiddenLayer = tmp;
      current = i;
      var upcoming = (current + 1) % images.length;
      hiddenLayer.style.backgroundImage = "url('" + images[upcoming] + "')";
      hiddenLayer.classList.remove('visible');
      intervalId = setInterval(advance, intervalMs);
    }, transitionMs + 25);
  }

  // keep moving dot aligned on resize
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ positionMovingDotOn(current); }, 120);
  });

})();
</script>
